<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalStorage - Música</title>

    <link rel="stylesheet" href="local.css">
</head>

<body>

    <div class="lado-esquerdo"></div>
    <div class="lado-direito"></div>

    <main>

        <div class="titulo">
            <p>MINHA LISTA DE MÚSICAS</p>
            <h1>MINHAS<br>MÚSICAS</h1>
        </div>

        <div class="celular">


            <div class="botao-silencioso"></div>
            <div class="botao-volume-1"></div>
            <div class="botao-volume-2"></div>
            <div class="botao-lateral"></div>


            <div class="tela">

                <div class="camera">

                    <div class="camera-ponto"></div>

                    <div class="camera-lente"></div>

                </div>


                <div class="conteudo">

                    <div class="topo">
                        <span>♫</span>

                        <h2>Minha Playlist</h2>

                        <span>•••</span>
                    </div>


                    <div class="adicionar">

                        <input type="text" id="musica" placeholder="Nome da música">

                        <input type="text" id="imagem" placeholder="Link da capa">

                        <button id="adicionar">+</button>

                    </div>


                    <p id="mensagem"></p>


                    <ul id="lista"></ul>

                </div>

            </div>

        </div>


        <div class="texto-lateral">

            <p>COLLECTION</p>

            <span>
                songs<br>
                that stay<br>
                with me.
            </span>

        </div>

    </main>


    <script src="local.js"></script>

</body>

</html>
